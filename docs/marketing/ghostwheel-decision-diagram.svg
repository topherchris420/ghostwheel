<text x="97" y="145" fill="#A2DACF" text-anchor="middle" font-size="11" font-weight="700">NO REAL ACTUATION</text>
</g>
<path d="M892 317H915" stroke="#D08C67" stroke-width="2.5"/>
<path d="M908 312L916 317 908 322" fill="none" stroke="#D08C67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(923 235)">
<rect width="227" height="163" rx="15" fill="url(#card)" stroke="#374853"/>
<rect x="17" y="20" width="33" height="25" rx="6" fill="#3B4A54"/>
<text x="33.5" y="37" text-anchor="middle" fill="#EFF5F7" font-size="13" font-weight="700">04</text>
<text x="61" y="38" fill="#98ABB5" font-weight="700" font-size="14" letter-spacing=".8">EVIDENCE</text>
<text x="19" y="84" fill="#F4F7F7" font-size="22" font-weight="700">RECORDED</text>
<text x="19" y="114" fill="#B8C6CC" font-size="15">Verdict + event trail</text>
<rect x="18" y="131" width="124" height="20" rx="10" fill="#344451"/>
