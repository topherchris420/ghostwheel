[package]
name = "ghostwheel"
version = "0.1.0"
description = "GHOSTWHEEL GW-01 automotive cybersecurity simulator"
authors = ["GHOSTWHEEL Research"]
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
