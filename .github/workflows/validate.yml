name: Validate simulator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source release preflight
        run: python scripts/release_gate.py
      - run: npm ci
      - run: npm run format:check
      - run: npm run verify:browser
      - run: npm run verify:workspace
      - run: npm run build
      - name: Backend, evidence, and release-gate unit tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s tests -v
      - name: Run reproducible backend research experiments
        env:
          PYTHONPATH: backend
        run: python scripts/verify.py
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostwheel-source-verification
          path: |
            output/verification/verification.json
            output/verification/tests.txt
          if-no-files-found: ignore
          retention-days: 14
