name: Windows application
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Select supported MSVC Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run format:check
      - name: Verify browser simulator against the Python backend
        run: npm run verify:browser
      - run: python -m pip install -r scripts/build-requirements.txt
      - name: Verify backend
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'backend'
          python -m unittest discover -s tests -v
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Smoke test frozen backend and bundled CARLA client
        run: python scripts/desktop-smoke.py --backend src-tauri/binaries/ghostwheel-backend-x86_64-pc-windows-msvc.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GHOSTWHEEL-Windows-x64
          path: output/release/*
          if-no-files-found: error
